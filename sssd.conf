[sssd]
config_file_version = 2
services = nss, pam, ssh, sudo
domains =  vitru.local, grupouniasselvi, adm-cesumar

[domain/vitru.local]
case_sensitive = Preserving
id_provider = ldap
cache_credentials = True
ldap_uri = ldaps://vitru.local
ldap_search_base = DC=vitru,DC=local
ldap_schema = AD
ldap_default_bind_dn = CN=SSSD_Linux,OU=AC_Servicos Internos,OU=Contas Especificas - Geral,DC=vitru,DC=local
ldap_default_authtok_type = obfuscated_password
ldap_default_authtok = AAAgAJaISvo6vUC8YxzZSxOClX8vc2RkAe5B6MJQLIi39riLysfghp6sKH6cPQtKfRfixEvgKdKnKbt94J11wanG6qUWc3pNoI4aH5D7Jnp5xpkjAAECAw==
ldap_tls_reqcert = allow
ldap_id_mapping = True
ldap_referrals = False
ldap_user_search_base = DC=vitru,DC=local
ldap_group_search_base = DC=vitru,DC=local
access_provider = permit
sudo_provider = ldap
auth_provider = ldap
autofs_provider = ldap
resolver_provider = ldap
enumerate = False
fallback_homedir = /home/%d/%u
default_shell = /bin/bash
use_fully_qualified_names = False

[domain/grupouniasselvi]
case_sensitive = Preserving
id_provider = ldap
cache_credentials = True
ldap_uri = ldaps://sssd-linux.grupouniasselvi.local
ldap_search_base = DC=grupouniasselvi,DC=local
ldap_schema = AD
ldap_default_bind_dn = CN=SSSD_Linux,OU=Linux-SSSD,OU=Infra,OU=TI,OU=Financeiro,OU=Corporativo,OU=NEAD,OU=Unidades,DC=grupouniasselvi,DC=local
ldap_default_authtok_type = obfuscated_password
ldap_default_authtok = AAAQABBFEOLCxmtXgqumgH5ffAMrXgPqs1A9csCj1zIjNvDIx35OAOpy74fnAOQBurBncL8FgYz4+9MQK+BTjKaW3VsAAQID
ldap_tls_reqcert = allow
ldap_id_mapping = True
ldap_referrals = False
ldap_user_search_base = DC=grupouniasselvi,DC=local
ldap_group_search_base = DC=grupouniasselvi,DC=local
enumerate = False
fallback_homedir = /home/%u@%d
default_shell = /bin/bash
use_fully_qualified_names = True

