# Configurações padrão SSH (PermitRootLogin não é alterado)
PubkeyAuthentication yes
PasswordAuthentication yes
UsePAM yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
PermitTunnel no

# Auditoria
LoginGraceTime 60
MaxAuthTries 6
ClientAliveInterval 300
ClientAliveCountMax 5
LogLevel VERBOSE

# Grupos autorizados a iniciar sessão SSH (grupos já existentes + novos do AD)
AllowGroups suporte_local GS_Linux_ADM_VTR GS_Linux_NOC_vitru GS_Linux_ADM_unc GS_Linux_NOC_unc GS_Linux_ADM_unc@adm-cesumar.local GS_Linux_NOC_unc@adm-cesumar.local Access_Root@grupouniasselvi.local GS_Linux_ADM_UNA@grupouniasselvi.local
