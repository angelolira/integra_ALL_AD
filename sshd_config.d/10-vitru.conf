# Configurações padrão SSH (PermitRootLogin não é alterado)
PubkeyAuthentication yes
PasswordAuthentication yes
UsePAM yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
PermitTunnel no

# Auditoria
LoginGraceTime 60
MaxAuthTries 6
ClientAliveInterval 300
ClientAliveCountMax 5
LogLevel VERBOSE

# Grupos autorizados a iniciar sessão SSH (grupos já existentes + novos do AD)
AllowGroups suporte_local GS_Linux_ADM_VTR GS_Linux_DEV_VTR GS_Linux_NOC_vitru GS_Linux_SI_vitru GS_Linux_ADM_unc GS_Linux_NOC_unc GS_LINUX_TesteLdap_unc GS_Linux_ADM_unc@adm-cesumar.local GS_Linux_NOC_unc@adm-cesumar.local GS_LINUX_TesteLdap_unc@adm-cesumar.local GS_Linux_DEV_UNA@grupouniasselvi.local Access_Root@grupouniasselvi.local GS_Linux_TESTELDAP_VTR GS_Linux_ADM_UNA@grupouniasselvi.local GS_Linux_TESTELDAP_UNA@grupouniasselvi.local GS_Linux_DB_VTR GS_Linux_DB_UNA@grupouniasselvi.local GS_Linux_DB_UNC@adm-cesumar.local
